name: CI

# The release workflow gates on the same checks, but it only ever runs on a
# tag. Without this workflow a regression is found at release time, which is
# the worst moment to find one.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  # Must not fall behind the `go` directive in go.mod. When it did (1.23 here
  # against 1.25.0 there) the default GOTOOLCHAIN=auto silently downloaded
  # whatever 1.25.x the proxy served, so the pin described a toolchain that
  # never ran and the binaries were produced by an unpinned one.
  GO_VERSION: "1.25.13"
  GOVULNCHECK_VERSION: "v1.6.0"
  GOSEC_VERSION: "v2.28.0"
  STATICCHECK_VERSION: "2025.1.1"

jobs:
  check:
    name: Vet, test, policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      # vet type-checks test files too, so this catches a test that cannot
      # compile for Windows -- which is not hypothetical: a Unix-only
      # syscall.Stat_t in cmd/smtprelayd/gencert_test.go made every test in
      # that package unbuildable there, behind a runtime.GOOS skip that never
      # got to run, and nothing noticed because every job here is Linux.
      # Seconds on this runner, and it does not need a Windows one.
      - name: Vet for windows/amd64
        run: GOOS=windows GOARCH=amd64 go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Banned imports across the full dependency graph
        run: ./scripts/check-banned-imports.sh

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      # CLAUDE.md's definition of done has always required gosec clean; until
      # 2026-08-12 nothing ran it. No rule is excluded and no directory is
      # skipped: the fifteen exceptions the tree needs are #nosec annotations
      # at the line they apply to, each naming the property that makes it one,
      # so a later change that breaks that property fails here instead of
      # inheriting a blanket exemption.
      - name: Static security analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@${{ env.GOSEC_VERSION }} -severity=medium ./...

      # gofmt, go vet, govulncheck and gosec between them do not report an
      # unexported function nobody calls, which is how listener.domainOf
      # survived as a copy of router.domainOf long after routing moved out of
      # that package -- doc comment still claiming a purpose it no longer had.
      # Run over the whole tree this found three things in ~23k lines, so this
      # gate is prevention rather than cleanup. The one suppression it needs
      # is a //lint:ignore at the line it applies to, naming the reason, the
      # same rule the #nosec annotations follow.
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@${{ env.STATICCHECK_VERSION }} ./...

      # internal/selftest probes the built binary the way a device reaches
      # it, but it needs a running instance, so it had never run here: the
      # refusal of an unmatched source could regress with every other gate
      # still green. The unit tests added alongside this cover the refusal in
      # the session; this covers the shipped binary and its configuration
      # loader together.
      - name: Open relay probe against a running instance
        run: make build && ./scripts/selftest-ci.sh

  windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Windows is a shipped platform and a production one (M365 with DPAPI),
      # and roughly 630 lines of the tree are Windows-only: the data directory
      # ACL, the reparse-point refusal, DPAPI secret decryption, the service
      # wrapper. Until this job existed none of it ran anywhere, and neither
      # did the platform-neutral tests on the platform whose file semantics
      # differ -- Windows refuses to delete a file the process still holds
      # open, which the delivery path has explicit code for.
      #
      # No -race here: it needs cgo, and the Linux job already runs it. What
      # this adds is the platform, not the detector.
      - name: Test
        run: go test ./...

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Every phase's definition of done requires both platforms to compile,
      # so this is a gate and not a release-time discovery.
      - name: Build linux/amd64, linux/arm64, windows/amd64
        run: make build-all
