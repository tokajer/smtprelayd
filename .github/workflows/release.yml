name: Release

# Only third-party build TOOLS are used here (nfpm, WiX — both already
# preinstalled or fetched via `go run`), never a third-party release/publish
# ACTION: the release itself is created with the gh CLI and provenance comes
# from GitHub's own attest-build-provenance action. See the "Release
# provenance and SBOM in CI" decision in PROGRESS.md.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (defaults to the current ref)"
        required: false

permissions:
  contents: read

env:
  # Keep in step with go.mod's `go` directive and with ci.yml. A pin below it
  # does not lower the toolchain -- GOTOOLCHAIN=auto downloads a newer one --
  # it only stops describing what actually produced the release binaries.
  GO_VERSION: "1.25.13"
  NFPM_VERSION: "v2.47.0"
  GOVULNCHECK_VERSION: "v1.6.0"
  CYCLONEDX_VERSION: "v1.10.0"

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      pkg_version: ${{ steps.version.outputs.pkg_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resolve version
        id: version
        # The tag reaches the shell through the environment, never through
        # ${{ }} interpolation into the script body: a ref name may legally
        # contain $( ) and backticks, and a workflow_dispatch input is not
        # constrained at all, so interpolating either would execute it here
        # before the pattern below ever ran.
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RAW_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tags must look like vMAJOR.MINOR.PATCH, got: $RAW_TAG" >&2
            exit 1
          fi
          echo "version=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "pkg_version=${RAW_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Vet, format, test, vulnerability scan
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

      - name: Banned imports across the full dependency graph
        run: ./scripts/check-banned-imports.sh

      - name: Build linux/amd64, linux/arm64, windows/amd64
        run: make build-all VERSION=${{ steps.version.outputs.version }}

      - name: SBOM
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${{ env.CYCLONEDX_VERSION }}
          make sbom VERSION=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: bin
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: dist
          retention-days: 7

  package-linux:
    name: Package deb/rpm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: bin

      - name: Build .deb and .rpm for amd64 and arm64
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod +x bin/* packaging/linux/*.sh
          cd packaging/linux
          for arch in amd64 arm64; do
            for packager in deb rpm; do
              VERSION="${{ needs.build.outputs.pkg_version }}" ARCH="$arch" \
                go run github.com/goreleaser/nfpm/v2/cmd/nfpm@${{ env.NFPM_VERSION }} package \
                --config nfpm.yaml --packager "$packager" --target ../../dist/
            done
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: dist
          retention-days: 7

  package-windows:
    name: Build Windows installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: bin

      - name: Build MSI with WiX Toolset
        shell: pwsh
        run: |
          if (-not $env:WIX) {
            throw "WIX toolset not found on this runner image; update this step if the runner changed."
          }
          New-Item -ItemType Directory -Force -Path obj, dist | Out-Null
          $wixBin = Join-Path $env:WIX "bin"
          & "$wixBin\candle.exe" -ext WixUtilExtension `
            -dVersion="${{ needs.build.outputs.pkg_version }}" `
            -dBinaryPath="bin\smtprelayd-windows-amd64.exe" `
            -dExampleConfigPath="configs\smtprelayd.example.toml" `
            -out "obj\smtprelayd.wixobj" "packaging\windows\smtprelayd.wxs"
          if ($LASTEXITCODE -ne 0) { throw "candle.exe failed" }
          & "$wixBin\light.exe" -ext WixUtilExtension `
            -out "dist\smtprelayd-${{ needs.build.outputs.pkg_version }}-amd64.msi" `
            "obj\smtprelayd.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "light.exe failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: dist
          retention-days: 7

  release:
    name: Publish release
    needs: [build, package-linux, package-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: release

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: release

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages
          path: release

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: release

      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "release/*"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh release create has no --clobber; a re-run of the same tag
          # (e.g. after a fix later in this job) must replace the existing
          # release rather than fail, so delete it first if present. The git
          # tag itself is left alone.
          TAG="${{ needs.build.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes
          fi
          gh release create "$TAG" release/* \
            --repo "${{ github.repository }}" \
            --title "smtprelayd ${TAG}" \
            --generate-notes
