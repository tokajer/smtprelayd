name: smtprelayd
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: mail
priority: optional
maintainer: Tokajer <s.toka.schweitzer@gmail.com>
homepage: https://github.com/tokajer/smtprelayd
license: GPL-3.0-or-later
description: |
  SMTP relay for internal devices (printers, ERP, monitoring), forwarding
  to a smarthost, primarily Microsoft 365 via OAuth2 / XOAUTH2.

depends:
  - systemd

contents:
  - src: ../../bin/smtprelayd-linux-${ARCH}
    dst: /usr/sbin/smtprelayd
    expand: true
    file_info:
      mode: 0755
      owner: root
      group: root

  - src: smtprelayd.service
    dst: /usr/lib/systemd/system/smtprelayd.service
    file_info:
      mode: 0644
      owner: root
      group: root

  - src: ../../configs/smtprelayd.example.toml
    dst: /etc/smtprelayd/smtprelayd.toml.example
    file_info:
      mode: 0640
      owner: root
      group: root

  - dst: /etc/smtprelayd
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: root

  - dst: /var/lib/smtprelayd
    type: dir
    file_info:
      mode: 0700
      owner: root
      group: root

scripts:
  preinstall: preinstall.sh
  postinstall: postinstall.sh
  preremove: preremove.sh
